services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: facilitator
      POSTGRES_PASSWORD: facilitator
      POSTGRES_DB: facilitator
    ports:
      # Non-default host port to stay clear of any locally running Postgres
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilitator"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
